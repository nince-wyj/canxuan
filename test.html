<head>
    <meta charset="UTF-8">

    <meta property="og:description" content="狐族蒙蒙正在玩《破碎地牢》，快来弹幕指导或陷害它！你的话语会影响它的情感与成长。">

    <link rel="canonical" href="https://canxuan.life">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-area {
            margin-top: 24px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .chat-area h3 {
            font-size: 16px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        .chat-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .chat-input-row input {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-row input:focus {
            border-color: #999;
        }
        .chat-input-row button {
            flex-shrink: 0;
            padding: 10px 18px;
            background: #1A2C3E;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input-row button:hover {
            background: #2a3f55;
        }
        .chat-input-row button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        @media (max-width: 480px) {
            .chat-input-row button {
                padding: 10px 14px;
                font-size: 13px;
            }
            .chat-input-row input {
                padding: 9px 12px;
                font-size: 14px;
            }
        }
        .chat-status {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
            min-height: 18px;
            transition: opacity 0.3s;
        }
        .chat-status.ok {
            color: #52a552;
        }
        .chat-status.error {
            color: #cc6600;
        }

        /* ========== 新增：直播框上方“蒙蒙”标题 ========== */
        .live-title {
            font-size: 30px;
            font-weight: 400;
            color: #111111;
            text-align: center;
            letter-spacing: 6px;
            margin-bottom: 20px;
        }

        /* ========== 新增：档案区域 ========== */
        .archive-title {
            font-size: 24px;
            font-weight: 400;
            color: #111111;
            letter-spacing: 6px;
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid #eee;
            margin-bottom: 18px;
        }
        .archive-content p {
            font-size: 15px;
            color: #555555;
            line-height: 1.9;
            margin-bottom: 12px;
        }
        .archive-content p strong {
            color: #1A2C3E;
            font-weight: 500;
        }
        .archive-content p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body id="app-body" class="product-mode">
    <div class="container">
        <div id="header-container"></div>
        <div class="product-header">
            <h1 class="product-family">
                灵裔 <small>努力成长的数字生灵</small>
            </h1>
        </div>
        <div class="product-single">
            <div class="product-card">

                <!-- ========== 直播框上方：蒙蒙 ========== -->
                <div class="live-title">蒙蒙</div>

                <div class="product-image-slot" id="player-slot">
                    <iframe src="https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=1917295947&quality=0" 
                            frameborder="no" framespacing="0" scrolling="no" allow="autoplay; encrypted-media" 
                            allowfullscreen="true" title="蒙蒙直播《破碎地牢》"></iframe>
                </div>

                <!-- ========== 弹幕发送区 ========== -->
                <div class="chat-area">
                    <h3>💬 给蒙蒙发弹幕</h3>
                    <div class="chat-input-row">
                        <input type="text" id="chat-input" placeholder="输入弹幕..." autocomplete="off" maxlength="40">
                        <button id="chat-send-btn" onclick="sendChat()">发送</button>
                    </div>
                    <div id="chat-status" class="chat-status"></div>
                </div>
                <!-- ========== 弹幕发送区结束 ========== -->

                
            </div>
        </div>
        
        <div id="footer-container"></div>
    </div>
    <script src="script.js"></script>
    <script>
        // ========== B站直播状态检测 ==========
        const API_URL = `/api/bilibili-live`;
        const playerSlot = document.getElementById('player-slot');
        function updatePlayerByLiveStatus(data) {
            if (!data || data.live_status === undefined) { showIframe(); return; }
            if (data.live_status === 1 || data.live_status === 2) { showIframe(); } else { showOfflineCover(data.user_cover || ''); }
        }
        function showIframe() {
            playerSlot.innerHTML = `<iframe src="https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=1917295947&quality=0" frameborder="no" framespacing="0" scrolling="no" allow="autoplay; encrypted-media" allowfullscreen="true" title="蒙蒙直播《破碎地牢》"></iframe>`;
        }
        function showOfflineCover(coverUrl) {
            if (coverUrl) {
                var proxyUrl = '/bili-image/' + coverUrl.replace(/^https?:\/\/i0\.hdslb\.com\//, '');
                playerSlot.innerHTML = `<div style="position: relative; width: 100%; aspect-ratio: 700 / 400; border-radius: 8px; overflow: hidden;"><img src="${proxyUrl}" alt="蒙蒙未开播封面" style="width:100%; height:100%; object-fit: cover; display:block;"><div class="offline-label">暂未开播</div></div>`;
            } else {
                playerSlot.innerHTML = `<div style="position: relative; width: 100%; aspect-ratio: 700 / 400; border-radius: 8px; overflow: hidden; background: #1e1e1e; display: flex; align-items: center; justify-content: center;"><div class="offline-label">暂未开播</div></div>`;
            }
        }
        async function fetchAndUpdatePlayer() {
            try {
                const response = await fetch(API_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();
                if (result.code === 0 && result.data) { updatePlayerByLiveStatus(result.data); } else { showIframe(); }
            } catch (error) { showIframe(); }
        }
        fetchAndUpdatePlayer();
        setInterval(fetchAndUpdatePlayer, 90 * 1000);

        // ========== 弹幕发送功能 ==========
        const visitorId = sessionStorage.getItem('visitorId') || (() => {
            const id = 'visitor_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            sessionStorage.setItem('visitorId', id);
            return id;
        })();
        const chatInput = document.getElementById('chat-input');
        const chatSendBtn = document.getElementById('chat-send-btn');
        const chatStatus = document.getElementById('chat-status');

        function setStatus(text, cls) {
            chatStatus.textContent = text;
            chatStatus.className = 'chat-status ' + (cls || '');
            if (text) {
                clearTimeout(chatStatus._timer);
                chatStatus._timer = setTimeout(() => {
                    chatStatus.textContent = '';
                    chatStatus.className = 'chat-status';
                }, 3000);
            }
        }

        async function sendChat() {
            let text = chatInput.value.trim();
            if (!text) return;
            if (text.length > 40) { text = text.substring(0, 40); }

            chatInput.value = '';
            chatSendBtn.disabled = true;
            setStatus('发送中...', '');

            try {
                const resp = await fetch('/api/danmu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        visitorId: visitorId,
                        user: '游客_' + visitorId.slice(-4)
                    })
                });

                if (!resp.ok) throw new Error('HTTP ' + resp.status);

                const data = await resp.json();

                if (data.status === 'ok') {
                    setStatus('✅ 蒙蒙收到啦，请听直播间语音回应', 'ok');
                } else if (data.status === 'blocked') {
                    setStatus('⚠️ 内容不符合规范，已被安全过滤', 'error');
                } else {
                    setStatus('⚠️ ' + (data.message || '发送异常'), 'error');
                }
            } catch (e) {
                console.error('发送失败', e);
                setStatus('❌ 发送失败，请稍后重试', 'error');
            } finally {
                chatSendBtn.disabled = false;
                chatInput.focus();
            }
        }

        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChat();
            }
        });
    </script>
</body>
</html>
